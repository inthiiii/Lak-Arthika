name: External signal freshness

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-weather-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --locked --all-groups

      - name: Validate external-signal contracts
        run: uv run pytest tests/test_external_signals.py

      - name: Refresh the latest fourteen days of NASA POWER signals
        run: |
          start_date=$(date -u -d '14 days ago' +%F)
          end_date=$(date -u +%F)
          uv run lak-arthika signals sync-weather --from "$start_date" --to "$end_date"

      - name: Upload reviewed signal snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: external-signals-${{ github.run_id }}
          path: data/processed/signals/external_signals.parquet
          retention-days: 14
